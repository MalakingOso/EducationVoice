[package]
name = "article2pod-gui"
version = "0.1.0"
edition = "2021"
default-run = "article2pod-gui"

[[bin]]
name = "article2pod-gui"
path = "src/main.rs"

# Proves the event stream and the cancel path without a window. Build order
# step 4 exists so the process plumbing is known-good before any UI sits on
# top of it; this binary is what makes that step runnable.
[[bin]]
name = "run_smoke"
path = "src/bin/run_smoke.rs"

# Answers one question the rest of the drop path rests on: does a WebKitGTK
# drop still carry native paths once GDK_BACKEND=x11 is forced? Kept rather
# than deleted, because a WebKitGTK update can silently take that away.
[[bin]]
name = "drop_smoke"
path = "src/bin/drop_smoke.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
